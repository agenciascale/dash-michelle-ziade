<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Michelle Ziade — Imersão · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Imersão — Lançamento · Michelle Ziade</h1>
      <div class="sub"><b>Funil de venda direta</b> · faturamento real (Hotmart)</div>
      <div class="taxnote" id="taxNote"></div>
    </div>
    <div class="upd" id="upd"><span class="dot"></span>carregando…</div>
  </div>

  <div class="periods" id="periods"></div>
  <div class="range" id="range"></div>

  <div class="card revblock" id="revblock"></div>

  <div class="sec">
    <h2>Investimento por funil <span>— com imposto ×1,1385</span></h2>
    <div class="grid funil-grid" id="funilInv"></div>
  </div>

  <div class="grid kpis" id="kpis"></div>

  <div class="sec">
    <h2>Funil <span>— do investimento à venda</span></h2>
    <div class="card funnel" id="funnel"></div>
  </div>

  <div class="sec">
    <h2>Evolução diária <span>— investimento × vendas</span></h2>
    <div class="card chartcard">
      <div class="legend" id="legend"></div>
      <svg class="chart" id="chart" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <div class="sec">
    <h2>Otimização <span>— onde o custo por resultado é mais barato</span></h2>
    <div class="tabs" id="tabs"></div>
    <div class="card tablecard"><div id="table"></div></div>
  </div>

  <div class="foothint" id="hint"></div>
</div>
<script>var _t=Date.now();document.write('<scr'+'ipt src="data.js?t='+_t+'"><\/scr'+'ipt>');document.write('<scr'+'ipt src="app.js?t='+_t+'"><\/scr'+'ipt>');</script>
</body>
</html>
